<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScanAI Health</title>
    <link rel="stylesheet" href="style/index.css" />
</head>

<body>
    <header class="header">
        <div class="logo-box">
            <img src="image/logo.png" alt="">
        </div>
    </header>

    <main class="main">
        <div class="card">
            <div class="image">
                <img src="image/index_image.png" alt="Medical scan">
            </div>

            <div class="text">
                <h1>
                    Discover your health with
                    <span>AI-Powered analysis</span>
                </h1>
                <p>Upload your CT scan and get instant insights.</p>
                <button class="btn" onclick="window.location.href='upload_data.html'">
                    Start Analysis
                </button>

            </div>
        </div>
    </main>
</body>

</html>
